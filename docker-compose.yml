services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kaalkram-postgres
    environment:
      POSTGRES_USER: kaalkram
      POSTGRES_PASSWORD: kaalkram_dev
      POSTGRES_DB: kaalkram
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaalkram -d kaalkram"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    container_name: kaalkram-neo4j
    environment:
      NEO4J_AUTH: neo4j/kaalkram_dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
  neo4jdata:
